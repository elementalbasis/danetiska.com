name: Danetian Academy
url: "https://danetiska.com"
description: >-
  The Danetian Academy is dedicated to the study, development, and documentation
  of Danetian, a constructed Indo-European language with its own history,
  literature, and culture.
permalink: /:collection/:title
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag
email: academia@danetiska.com
exclude:
  - README.md
  - docs
  - tests
  - scripts

defaults:
  - scope:
      path: "academicians"
      type: pages
    values:
      layout: academician
      section: academy
      section_pagination: false
      nav_exclude: true
      nav_parent: /academicians/
